<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oblivions Map Editor</title>
  <script type="module" crossorigin src="./assets/index-BuoW-uGL.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BITS5UYB.css">
</head>
<body>
    <div id="app">
        <header class="editor-header">
            <div class="header-left">
                <svg class="header-deco" viewBox="0 0 60 60" width="36" height="36">
                    <polygon points="30,8 6,52 54,52" fill="#ff7675" stroke="#2d3436" stroke-width="3" stroke-linejoin="round"/>
                    <circle cx="30" cy="24" r="14" fill="#ffeaa7" stroke="#2d3436" stroke-width="3"/>
                    <circle cx="26" cy="22" r="2" fill="#2d3436"/>
                    <circle cx="34" cy="22" r="2" fill="#2d3436"/>
                    <path d="M 27 30 Q 30 33 33 30" fill="none" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <h1>Oblivions Map Editor</h1>
            </div>
            <div class="header-actions">
                <button class="btn btn-import" id="btnImportDir" title="选择 gamedata 目录自动导入（连接后端后自动切换为「从后端导入」）">导入目录</button>
                <button class="btn btn-import" id="btnImport" title="手动粘贴 PHP 数据">手动导入</button>
                <button class="btn btn-quick-export" id="btnQuickExport" style="display:none" title="快速导出（需先连接后端，AI 约束）">快速导出</button>
                <button class="btn btn-export" id="btnExport" title="导出ZIP（需先连接后端，AI 约束）" disabled>导出ZIP</button>
            </div>
        </header>

        <main class="editor-layout">
            <div class="col-left" id="colLeft">
                <div class="panel panel-regions">
                    <h2>区域列表</h2>
                    <div id="regionList" class="region-list"></div>
                    <button class="btn btn-add" id="btnAddRegion">+ 新建区域</button>
                </div>
                <div class="panel panel-region-props" id="regionPropsPanel" style="display:none;">
                    <h2>区域属性</h2>
                    <div id="regionProps"></div>
                </div>
            </div>

            <div class="col-center">
                <div class="toolbar" id="toolbar">
                    <button class="tool-btn active" data-tool="select" title="选择 (V)">选择</button>
                    <button class="tool-btn" data-tool="draw" title="绘制 (B)">绘制</button>
                    <button class="tool-btn" data-tool="erase" title="擦除 (E)">擦除</button>
                    <button class="tool-btn" data-tool="paint" title="油漆桶 (F)">油漆桶</button>
                    <span class="tool-sep"></span>
                    <button class="tool-btn" data-tool="break" title="断开连通 (D)">断开</button>
                    <button class="tool-btn" data-tool="restore" title="恢复连通 (R)">恢复</button>
                    <span class="tool-sep"></span>
                    <button class="tool-btn tool-btn-sim" data-tool="sim-set-player" title="模拟玩家位置 (P)">玩家</button>
                    <span class="tool-sep"></span>
                    <div class="mode-switch" id="modeSwitch">
                        <button class="mode-btn active" data-mode="simulate" title="纯前端模拟，不写 DB（对齐 dry-run 契约）">Simulate</button>
                        <button class="mode-btn" data-mode="live" title="连接后端 DB 实例（阶段5 启用，需先连接后端）">Live</button>
                    </div>
                    <span class="tool-sep"></span>
                    <div class="brush-preset-panel" id="brushPresetPanel" style="display:none;">
                        <label class="brush-label">地板
                            <select id="brushFloor" class="brush-select">
                                <option value="standard">标准</option>
                                <option value="water">含水</option>
                                <option value="vegetation">覆植</option>
                                <option value="metal">金属</option>
                                <option value="magic">富魔力</option>
                            </select>
                        </label>
                        <label class="brush-label">潮汐
                            <select id="brushTide" class="brush-select">
                                <option value="shallow">浅滩</option>
                                <option value="deep">深水</option>
                                <option value="abyss">深海</option>
                            </select>
                        </label>
                        <label class="brush-label">通行
                            <input type="checkbox" id="brushPassable" checked>
                        </label>
                    </div>
                    <label class="grid-size-label">网格:
                        <input type="number" id="gridCols" min="1" max="30" value="8" style="width:40px"> ×
                        <input type="number" id="gridRows" min="1" max="30" value="6" style="width:40px">
                    </label>
                </div>
                <div class="panel panel-simulate" id="simParamPanel" style="display:none;">
                    <div class="sim-section">
                        <span class="sim-section-title">操作</span>
                        <button class="btn btn-sm btn-sim-action" id="btnSimVision" title="计算视野 BFS 并点亮本地迷雾">视野 BFS</button>
                        <button class="btn btn-sm btn-sim-action" id="btnSimExplore" title="模拟发现视野内道具">模拟探索</button>
                        <button class="btn btn-sm btn-sim-action" id="btnSimReset" title="清空玩家位置与所有模拟缓存">重置</button>
                    </div>
                    <div class="sim-section">
                        <span class="sim-section-title">参数</span>
                        <label class="sim-param-label">视野
                            <input type="range" id="simVisionRange" min="1" max="5" value="1" class="sim-slider">
                            <span class="sim-param-value" id="simVisionRangeVal">1</span>
                        </label>
                        <label class="sim-param-label">移动力
                            <input type="range" id="simMovePower" min="1" max="6" value="3" class="sim-slider">
                            <span class="sim-param-value" id="simMovePowerVal">3</span>
                        </label>
                        <label class="sim-param-label">发现数
                            <input type="range" id="simDiscoverLimit" min="0" max="10" value="3" class="sim-slider">
                            <span class="sim-param-value" id="simDiscoverLimitVal">3</span>
                        </label>
                    </div>
                    <div class="sim-section">
                        <span class="sim-section-title">叠层</span>
                        <label class="overlay-toggle"><input type="checkbox" id="overlayFog" data-overlay="fog"> 迷雾</label>
                        <label class="overlay-toggle"><input type="checkbox" id="overlayVision" data-overlay="vision"> 视野</label>
                        <label class="overlay-toggle"><input type="checkbox" id="overlayReachability" data-overlay="reachability"> 可达</label>
                        <label class="overlay-toggle"><input type="checkbox" id="overlayTideHeatmap" data-overlay="tideHeatmap"> 潮汐热图</label>
                        <label class="overlay-toggle overlay-toggle-backend" title="需连接后端（开局分布预览，观察者视角）"><input type="checkbox" id="overlayWildItem" data-overlay="wilditem" disabled> 道具分布</label>
                        <label class="overlay-toggle overlay-toggle-backend" title="需连接后端（开局分布预览，观察者视角）"><input type="checkbox" id="overlayPoi" data-overlay="poi" disabled> POI 分布</label>
                    </div>
                </div>
                <div class="panel panel-canvas">
                    <div class="canvas-wrap" id="canvasWrap">
                        <div class="grid-container" id="gridContainer"></div>
                        <svg class="connections-layer" id="connectionsLayer"></svg>
                    </div>
                    <div class="canvas-info" id="canvasInfo">选择一个区域开始编辑</div>
                </div>
            </div>

            <div class="col-right">
                <div class="right-tabs" id="rightTabs">
                    <button class="right-tab-btn active" data-rtab="tile">地图格</button>
                    <button class="right-tab-btn" data-rtab="config">配置文件</button>
                    <button class="right-tab-btn" data-rtab="validate" title="验证（阶段4）">验证</button>
                    <button class="right-tab-btn" data-rtab="backend" title="后端对接（阶段5）">后端</button>
                </div>
                <div class="right-tab-content" id="rtab-tile" style="display:flex;flex-direction:column;min-height:0;flex:1;">
                    <div class="panel panel-tile-props" id="tilePropsPanel">
                        <h2>地图格属性</h2>
                        <div id="tileProps">
                            <p class="hint">点击地图格查看属性</p>
                        </div>
                    </div>
                </div>
                <div class="right-tab-content" id="rtab-config" style="display:none;flex-direction:column;min-height:0;flex:1;">
                    <div class="panel panel-config" id="configPanel">
                        <p class="hint">配置面板加载中...</p>
                    </div>
                </div>
                <div class="right-tab-content" id="rtab-validate" style="display:none;flex-direction:column;min-height:0;flex:1;">
                    <div class="panel panel-validate" id="validatePanel">
                        <p class="hint">验证面板加载中...</p>
                    </div>
                </div>
                <div class="right-tab-content" id="rtab-backend" style="display:none;flex-direction:column;min-height:0;flex:1;">
                    <div class="panel panel-backend" id="backendPanel">
                        <p class="hint">后端面板加载中...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 导入对话框 -->
    <div class="modal-overlay" id="importModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>导入地图数据</h3>
                <button class="modal-close" id="importModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <p class="hint">粘贴 PHP 文件内容，或将文件拖入下方文本框</p>
                <label>map.php 内容：</label>
                <textarea id="importMapPhp" rows="8" placeholder="粘贴 map.php 的完整内容..."></textarea>
                <label>region_*.php 内容（多个区域用 --- 分隔）：</label>
                <textarea id="importTilesPhp" rows="10" placeholder="粘贴 region_1.php 内容&#10;---&#10;粘贴 region_2.php 内容"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn" id="importCancel">取消</button>
                <button class="btn btn-primary" id="importConfirm">导入</button>
            </div>
        </div>
    </div>

</body>
</html>
