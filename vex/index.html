<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="base-url" content="/phpdts">
    <title>OBLIVIONS — 遗忘之地</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/terminal.css">
    <link rel="stylesheet" href="css/battle.css">
</head>
<body class="h-screen overflow-hidden bg-bg text-fg-mid font-mono text-xs leading-[1.6] select-none">

    <div id="app" class="h-full flex flex-col">

        <!-- ═══ STATUS BAR ═══ -->
        <div class="status-bar flex-none">
            <!-- 左侧：位置 + 按钮 -->
            <div class="status-left">
                <div class="status-bar-row">
                    <span class="status-location" id="regionInfo"></span>
                    <span class="status-tick-debug" id="tickDebug" title="obl_tick / obl_pretick — 两者相等时NPC AI不触发">T: -/-</span>
                    <div class="bar-container"><div class="bar-fill hp" id="hpBar"></div></div>
                    <span class="bar-text" id="hpText">HP 0/0</span>
                </div>
                <div class="status-bar-row">
                    <span class="status-location" id="locationInfo"></span>
                    <div class="bar-container"><div class="bar-fill sp" id="spBar"></div></div>
                    <span class="bar-text" id="spText">SP 0</span>
                </div>
                <div class="status-bar-row">
                    <button class="status-bar-btn" id="playerDrawerBtn">[属性]</button>
                    <button class="status-bar-btn" id="battleBtn">[战斗]</button>
                    <button class="status-bar-btn" id="inventoryDrawerBtn">[背包]</button>
                </div>
            </div>
            <!-- 右侧：头像 -->
            <div class="status-avatar" id="statusAvatar">
                <span class="status-avatar-fallback">???</span>
            </div>
        </div>

        <!-- ═══ MAIN ═══ -->
        <main class="flex-1 grid grid-cols-[65%_1fr] min-h-0 overflow-hidden">

            <!-- LEFT: Map -->
            <div class="flex flex-col border-r border-fg-dim/30 min-h-0 overflow-hidden">

                <!-- Map -->
                <div class="flex-1 min-h-0 flex flex-col p-3 overflow-hidden">
                    <div class="ascii-title flex-none">
                        <span>┌─</span>
                        <span class="ascii-label">CARTOGRAPHY</span>
                        <span>─</span>
                        <span class="flex-1 ascii-line"></span>
                        <span>┐</span>
                    </div>
                    <div id="mapInfo" class="text-fg-dim text-[10px] py-1 flex-none"></div>
                    <div id="mapContainer" class="map-container flex-1 min-h-0 overflow-auto relative">
                        <div id="mapGrid" class="ascii-map-grid"></div>
                    </div>
                    <div class="zoom-controls" title="Ctrl+滚轮缩放 | 拖拽平移">
                        <button id="zoomOut" class="zoom-btn">-</button>
                        <span id="zoomLevel" class="zoom-label">1.0x</span>
                        <button id="zoomIn" class="zoom-btn">+</button>
                    </div>
                    <div class="ascii-title-bottom flex-none">
                        <span>└</span>
                        <span class="flex-1 ascii-line"></span>
                        <span>┘</span>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Log + Actions -->
            <div class="flex flex-col min-h-0 overflow-hidden">

                <!-- 正常模式：Log + Actions -->
                <div id="normalMode" class="flex flex-col min-h-0 overflow-hidden flex-1">

                    <!-- Log (flex:4) -->
                    <div class="min-h-0 flex flex-col p-3 overflow-hidden border-b border-fg-dim/30" style="flex:4 1 0%;">
                        <div class="ascii-title flex-none mb-1.5">
                            <span>┌─</span>
                            <span class="ascii-label">CHRONICLE</span>
                            <span>─</span>
                            <span class="flex-1 ascii-line"></span>
                            <span id="logUnreadBtn" class="log-unread-btn" style="display:none;">↓ <span id="logUnreadCount">0</span> 条新日志</span>
                            <span>┐</span>
                        </div>
                        <div class="flex-1 overflow-y-auto pl-2 border-l border-fg-dim/20 min-h-0">
                            <div id="logContent" class="text-fg-mid leading-[1.8]"></div>
                        </div>
                    </div>

                    <!-- Actions (flex:6) -->
                    <div class="min-h-0 flex flex-col p-3 overflow-hidden" style="flex:6 1 0%;">
                        <div class="ascii-title flex-none mb-1.5">
                            <span>┌─</span>
                            <span class="ascii-label">ACTIONS</span>
                            <span>─</span>
                            <span class="flex-1 ascii-line"></span>
                            <span>┐</span>
                        </div>
                        <div id="tileActionBar" class="flex-1 overflow-y-auto min-h-0"></div>
                    </div>
                </div>

                <!-- 战斗模式：Battle Actions（无日志区，动作区扩展） -->
                <div id="battleMode" class="flex flex-col min-h-0 overflow-hidden flex-1" style="display:none;">

                    <!-- Battle Actions (flex:1，扩展占满) -->
                    <div class="min-h-0 flex flex-col p-3 overflow-hidden flex-1">
                        <div class="ascii-title flex-none mb-1.5">
                            <span>┌─</span>
                            <span class="ascii-label">COMBAT</span>
                            <span>─</span>
                            <span class="flex-1 ascii-line"></span>
                            <span id="battleEnemyName" class="text-fg-dim text-[10px]"></span>
                            <span>┐</span>
                        </div>
                        <div id="battleActionBar" class="flex-1 overflow-y-auto min-h-0"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ═══ MODAL ═══ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle"></span>
                <button class="modal-close" id="modalCloseBtn">[X]</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- ═══ BATTLE MODAL（战斗演出模态框，纯展示） ═══ -->
    <div class="battle-modal-overlay" id="battleModalOverlay">
        <div class="battle-modal" id="battleModal">
            <div class="battle-modal-header" id="battleModalHeader">
                <div class="battle-modal-combatant enemy">
                    <div class="battle-modal-combatant-name" id="battleModalEnemyName">敌人</div>
                    <div class="battle-modal-hp-bar">
                        <div class="battle-modal-hp-fill" id="battleModalEnemyHpFill" style="width:100%"></div>
                    </div>
                    <div class="battle-modal-hp-text" id="battleModalEnemyHpText">HP: ?</div>
                </div>
                <div class="battle-modal-combatant player">
                    <div class="battle-modal-combatant-name" id="battleModalPlayerName">你</div>
                    <div class="battle-modal-hp-bar">
                        <div class="battle-modal-hp-fill" id="battleModalPlayerHpFill" style="width:100%"></div>
                    </div>
                    <div class="battle-modal-hp-text" id="battleModalPlayerHpText">HP: ?</div>
                </div>
            </div>
            <div class="battle-modal-body" id="battleModalBody"></div>
            <div class="battle-modal-footer" id="battleModalFooter">▼</div>
        </div>
    </div>

    <!-- ═══ TOAST ═══ -->
    <div class="toast-container fixed top-3 right-3 z-[500] flex flex-col gap-1.5 pointer-events-none" id="toastContainer"></div>

    <!-- ═══ LEFT DRAWER: Player ═══ -->
    <div class="drawer-overlay fixed inset-0 bg-black/70 z-[250]" id="drawerOverlay"></div>
    <div class="player-drawer fixed top-0 left-0 w-[280px] h-screen bg-bg z-[300] flex flex-col border-r-2 border-hi" id="playerDrawer">
        <div class="flex justify-between items-center px-4 py-3 border-b border-fg-dim/30 text-fg-bright text-xs tracking-widest flex-none">
            <span>┌─ SURVIVOR</span>
            <button class="text-fg-dim hover:text-hi transition-colors cursor-pointer text-sm" id="drawerCloseBtn">[X]</button>
        </div>
        <div id="playerInfo" class="flex-1 overflow-y-auto p-4 space-y-3 text-[11px]"></div>
    </div>

    <!-- ═══ RIGHT DRAWER: Inventory / Equipment ═══ -->
    <div class="inv-drawer-overlay fixed inset-0 bg-black/70 z-[350]" id="invDrawerOverlay"></div>
    <div class="inv-drawer fixed top-0 right-0 w-[300px] h-screen bg-bg z-[400] flex flex-col border-l-2 border-hi" id="invDrawer">
        <div class="flex justify-between items-center px-4 py-3 border-b border-fg-dim/30 text-fg-bright text-xs tracking-widest flex-none">
            <div class="flex gap-4">
                <button class="inv-tab active" data-tab="inventory">INVENTORY</button>
                <button class="inv-tab" data-tab="equipment">ARMAMENT</button>
            </div>
            <button id="invDrawerCloseBtn" class="text-fg-dim hover:text-hi transition-colors cursor-pointer text-sm">[X]</button>
        </div>
        <div id="invDrawerContent" class="flex-1 overflow-y-auto p-4 min-h-0"></div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
